<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Skin Minecraft 3D</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151f;font-family:Arial,sans-serif}
#skin{width:100%;height:100%;display:block}
#buttons{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:95%}
button{border:0;border-radius:8px;padding:10px 14px;background:#273244;color:white;font-size:14px;cursor:pointer}
button:hover{background:#3b475b}
button.active{background:#4caf50}
@media(max-width:600px){button{font-size:13px;padding:9px 11px}}
</style>
</head>
<body>
<canvas id="skin"></canvas>
<div id="buttons">
<button id="idle">🧍 Immobile</button>
<button id="walk">🚶 Marcher</button>
<button id="run">🏃 Courir</button>
<button id="wave">👋 Saluer</button>
<button id="hit">👊 Frapper</button>
<button id="crouch">🥷 Accroupi</button>
<button id="rotate">🔄 Rotation auto</button>
</div>

const viewer = new skinview3d.SkinViewer({
    canvas: document.getElementById("skin"),
    skin: SKIN_IMAGE
});

viewer.background = 0x10151f;
viewer.fov = 70;
viewer.zoom = 0.9;
viewer.globalLight.intensity = 2;
viewer.cameraLight.intensity = 0.7;
viewer.controls.enableRotate = true;
viewer.controls.enableZoom = true;
viewer.controls.enablePan = false;

const buttons = document.querySelectorAll("#buttons button");

function activateButton(button) {
    buttons.forEach(btn => btn.classList.remove("active"));
    if (button) button.classList.add("active");
}

document.getElementById("idle").onclick = function() {
    viewer.animation = new skinview3d.IdleAnimation();
    activateButton(this);
};

document.getElementById("walk").onclick = function() {
    viewer.animation = new skinview3d.WalkingAnimation();
    viewer.animation.speed = 1;
    activateButton(this);
};

document.getElementById("run").onclick = function() {
    viewer.animation = new skinview3d.RunningAnimation();
    viewer.animation.speed = 1.2;
    activateButton(this);
};

document.getElementById("wave").onclick = function() {
    viewer.animation = new skinview3d.WaveAnimation();
    viewer.animation.speed = 1;
    activateButton(this);
};

document.getElementById("hit").onclick = function() {
    viewer.animation = new skinview3d.HitAnimation();
    viewer.animation.speed = 1;
    activateButton(this);
};

document.getElementById("crouch").onclick = function() {
    viewer.animation = new skinview3d.CrouchAnimation();
    viewer.animation.speed = 1;
    activateButton(this);
};

let autoRotate = false;
document.getElementById("rotate").onclick = function() {
    autoRotate = !autoRotate;
    viewer.autoRotate = autoRotate;
    this.classList.toggle("active", autoRotate);
};

function resizeViewer() {
    viewer.width = Math.max(280, window.innerWidth);
    viewer.height = Math.max(350, window.innerHeight);
}

window.addEventListener("resize", resizeViewer);
resizeViewer();

viewer.animation = new skinview3d.IdleAnimation();
document.getElementById("idle").classList.add("active");
</script>
</body>
</html>
